<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<title>사람 운영 AI 실습장</title>
<style>
:root{
  --bg:#F5F7FA;--card:#FFFFFF;--ink:#0A1E55;--body:#2F3A4F;--sub:#6B7280;--line:#E2E7EF;
  --brand:#48A828;--brand-soft:#EAF5E3;--navy-soft:#EEF2F9;--warn:#FFF4E5;--warn-ink:#8A4B00;
  --tabbar:62px;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420;--card:#172033;--ink:#E6ECF7;--body:#C9D2E3;--sub:#93A0B8;--line:#26314A;
    --brand:#7CC94F;--brand-soft:#1C2A1A;--navy-soft:#1A2440;--warn:#2E2416;--warn-ink:#F2C27B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420;--card:#172033;--ink:#E6ECF7;--body:#C9D2E3;--sub:#93A0B8;--line:#26314A;
  --brand:#7CC94F;--brand-soft:#1C2A1A;--navy-soft:#1A2440;--warn:#2E2416;--warn-ink:#F2C27B;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--body);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:22px 0 10px}
header .eb{font-size:14px;font-weight:700;color:var(--brand)}
header h1{font-size:23px;line-height:1.35;margin:4px 0 4px;color:var(--ink)}
header p{margin:0;font-size:15px;color:var(--sub)}
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--warn);color:var(--warn-ink);
  border-radius:12px;padding:10px 14px;font-size:14.5px;margin:8px 0 14px}
.banner b{margin-right:6px}
h2.sec{font-size:19px;color:var(--ink);margin:6px 2px 4px}
.sec-desc{font-size:15px;color:var(--sub);margin:0 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-size:17px;margin:0 0 10px;color:var(--ink);display:flex;gap:8px;align-items:baseline}
.card h3 .n{color:var(--brand);font-size:15px;font-weight:800;min-width:1.4em}
.prompt{white-space:pre-wrap;background:var(--navy-soft);border-radius:10px;padding:13px;
  font-size:16px;line-height:1.7;margin:0;color:var(--ink);user-select:text;-webkit-user-select:text;font-family:inherit}
.hint{font-size:14.5px;color:var(--sub);margin:9px 2px 0}
.copy{margin-top:12px;width:100%;min-height:48px;border:0;border-radius:10px;font-size:16px;
  font-family:inherit;font-weight:700;background:var(--ink);color:var(--bg);cursor:pointer}
.copy.done{background:var(--brand)}
.pci{display:grid;gap:8px;margin:0 0 4px}
.pci div{background:var(--navy-soft);border-radius:10px;padding:11px 13px}
.pci b{display:block;color:var(--brand);font-size:15px}
.pci span{color:var(--ink);font-size:15.5px}
.steps{display:grid;grid-template-columns:1fr;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--navy-soft);border-radius:10px;padding:12px 13px}
.step .k{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step.human .k{background:var(--brand)}
.step p{margin:0;font-size:15.5px;color:var(--ink)}
.step small{display:block;color:var(--sub);font-size:14px}
label.in{display:block;font-size:14.5px;color:var(--sub);margin:4px 2px 6px}
input.txt{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .row{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
nav.tabbar button{border:0;background:none;font-family:inherit;font-size:14px;color:var(--sub);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav.tabbar button .dot{width:6px;height:6px;border-radius:50%;background:transparent}
nav.tabbar button[aria-selected="true"]{color:var(--ink);font-weight:800}
nav.tabbar button[aria-selected="true"] .dot{background:var(--brand)}
footer{font-size:13px;color:var(--sub);padding:6px 2px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eb">AI 실습장</div>
    <h1>사람 운영에 AI를 붙이는 90분</h1>
    <p>요청문을 눌러 복사하고 ChatGPT나 Gemini 앱에 붙여 넣으세요.</p>
  </header>
  <div class="banner"><b>넣지 않는 것</b>직원·지원자 이름과 연락처, 이력서 원본, 면담 내용, 임신·건강 정보</div>
  <main id="main"></main>
  <footer>근로조건, 복지 제도, 휴직 관련 문서는 시행 전에 노무사 확인을 받아 주세요.<br>이 페이지는 입력한 내용을 저장하거나 보내지 않습니다. · 다윈서비스</footer>
</div>
<nav class="tabbar" aria-label="실습 단계"><div class="row" id="tabs" role="tablist"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const T = {
 basic:{tab:"기본기",title:"먼저 감 잡기",desc:"AI가 우리를 얼마나 아는지 보고, 요청문의 기본 틀을 익힙니다."},
 hire:{tab:"채용",title:"채용",desc:"공고를 읽는 사람의 반응부터 듣고, 고치고, 나눠 씁니다."},
 onb:{tab:"신입 적응",title:"신입 적응",desc:"말로 설명한 업무가 체크리스트와 적응 계획이 됩니다."},
 rel:{tab:"관계",title:"관계와 유지",desc:"어려운 면담을 미리 연습하고, 붙잡을 방법을 찾습니다."},
 keep:{tab:"남기기",title:"직원에게 옮기고 남기기",desc:"직원들이 바로 써 볼 수 있게 옮기고, 오늘 만든 것을 정리합니다."}
};
const P = {
 basic:[
  {type:"lab"},
  {type:"pci"},
  {t:"막혔을 때: 요청문을 AI에게 맡기기",p:"나는 치과에서 직원 채용과 신입 교육을 맡고 있어. 신입 치과위생사 온보딩 자료를 만들고 싶은데, 어떤 요청문을 쓰면 좋을지 네가 먼저 요청문을 만들어 줘.",h:"뭐라고 시켜야 할지 모를 때 쓰는 방법입니다. AI가 만든 요청문을 고쳐서 다시 보내세요."},
  {t:"막혔을 때: 끝에 붙이는 한 문장",p:"필요한 정보를 저에게 질문해 주세요",h:"어떤 요청문이든 맨 끝에 붙이면, AI가 모자란 정보를 먼저 물어봅니다."},
  {type:"hitl"}
 ],
 hire:[
  {t:"공고가 없을 때 초안부터",p:"치과위생사 채용 공고 초안을 써 줘. 조건은 이거야.\n",h:"보낸 뒤 근무 시간, 휴무일, 급여 범위, 우리 치과 특징을 말로 덧붙이세요.",chk:1},
  {t:"구직자 세 사람이 읽는다",p:"너는 아래 세 사람이야.\n첫째, 평택 근처에서 일하는 3년차 치과위생사. 이직을 고민 중이고 출퇴근 거리, 업무 강도, 배울 수 있는 것을 중요하게 봐.\n둘째, 올해 졸업하는 신입 치과위생사. 첫 직장에서 잘 배울 수 있는지가 가장 중요해.\n셋째, 아이를 키우느라 1년 쉬었다가 복귀를 고민하는 치과위생사. 근무 시간과 분위기가 가장 중요해.\n아래 채용 공고를 각자 입장에서 읽고 지원하고 싶은지, 망설여지는 점은 무엇인지, 무엇이 더 적혀 있으면 좋겠는지 솔직하게 말해 줘.\n\n",h:"맨 아래에 우리 공고를 붙여 넣고 보내세요.",chk:1},
  {t:"반응을 반영해 다시 쓰기",p:"세 사람의 반응을 반영해서 공고를 다시 써 줘. 근무 조건 숫자는 바꾸지 말고 그대로 둬. 우리 치과의 장점은 이거야.\n",h:"우리만의 장점을 말로 보태세요. 예: 옆에서 배울 수 있는 수술 경험, 장비, 근무 환경",chk:1},
  {t:"세 곳에 나눠 쓰기",p:"이 공고를 세 가지로 바꿔 줘. 구인 사이트용 전체 버전, 인스타그램용 짧은 버전, 치위생과 학과 사무실에 보낼 졸업생 추천 요청 메일."},
  {t:"면접 질문과 평가 기준",p:"이 공고에 맞는 면접 질문 8개를 만들고, 각 질문마다 좋은 답과 아쉬운 답을 구분하는 기준을 표로 정리해 줘. 결혼, 출산 계획, 가족 관계처럼 사생활을 묻는 질문은 빼 줘."}
 ],
 onb:[
  {t:"말로 설명하면 체크리스트로",p:"지금부터 신입 치과위생사가 처음 배우는 업무 하나를 말로 설명할게. 처음 온 사람도 따라 할 수 있게 순서대로 체크리스트를 만들어 줘. 놓치기 쉬운 부분은 따로 표시해 줘.\n",h:"보낸 뒤 업무를 평소 신입에게 말하듯 설명하세요.",chk:1},
  {t:"첫 주 안내문",p:"새로 들어온 치과위생사에게 줄 첫 주 안내문을 써 줘. 첫날 할 일, 첫 주에 익힐 것, 모르는 게 있을 때 물어볼 사람 순서로. 긴장을 덜어 주는 말투로."},
  {t:"30일 적응 계획",p:"신입 치과위생사의 30일 적응 계획을 표로 만들어 줘. 1주차부터 4주차까지 익힐 것, 잘 익혔는지 확인하는 방법, 선임이 할 일을 칸으로 나눠서."},
  {t:"매뉴얼로 쌓아 둘 업무 목록",p:"치과 리셉션, 원무과, 치과위생사 업무 중에서 매뉴얼로 만들어 두면 휴가나 인수인계 때 도움이 되는 업무를 직무별로 10개씩 뽑아 줘. 자주 하는 일부터."}
 ],
 rel:[
  {t:"어려운 면담 연습",p:"지금부터 너는 우리 치과에서 3년째 일하는 치과위생사야. 요즘 업무량이 많아 지쳤고 그만둘까 고민도 하지만 먼저 말하지는 않아. 내가 면담을 시작할게. 실제 사람처럼 짧게 대답하고, 내가 잘 들어 주면 조금씩 속마음을 이야기해 줘.\n내가 면담 끝이라고 말하면 역할을 멈추고, 내 말 중에 좋았던 점 3개와 오해를 살 수 있었던 말 3개를 알려 줘.",h:"음성 대화로 하면 더 실감 납니다. 실제 직원 이야기는 넣지 마세요."},
  {t:"정기 면담 질문지",p:"치과 직원과 한 달에 한 번 하는 짧은 면담에서 쓸 질문 10개를 만들어 줘. 지치거나 그만둘 생각이 드는 신호를 일찍 알아챌 수 있는 질문 위주로. 부담스럽지 않은 말투로."},
  {t:"복지 아이디어",p:"작은 규모의 치과에서 비용 부담이 크지 않으면서 직원이 실제로 고마워할 복지와 인센티브 아이디어 20개를 표로 정리해 줘. 비용이 낮은 것부터. 근무 시간, 교육 지원, 휴가, 인정과 칭찬 분야를 골고루 넣어 줘.",h:"이 중 세 개만 골라 보세요."},
  {t:"휴직자 복귀 안내문",p:"육아휴직 중인 직원이 편하게 복귀할 수 있도록 보낼 안내문 초안을 써 줘. 휴직 중 필요할 때 연락하는 방법, 복귀 한 달 전에 같이 준비할 것, 복귀 첫 주 적응 지원 내용으로. 부담을 주는 표현은 넣지 마.",h:"보내기 전에 노무사 확인을 받아 주세요."}
 ],
 keep:[
  {t:"외국인 환자 통역",p:"지금부터 통역을 해 줘. 내가 한국어로 말하면 영어로, 상대가 영어로 말하면 한국어로 옮겨 줘. 나는 치과 접수 직원이야.",h:"앱의 음성 대화를 켜고 말로 해 보세요."},
  {t:"직원 공지 1장",p:"우리 치과 직원들에게 AI를 업무에 써 보자고 권하는 공지문을 A4 한 장 분량으로 써 줘. 지켜야 할 약속 세 가지를 넣어 줘. 환자와 직원 개인정보는 넣지 않는다, 환자에게 나가는 글은 사람이 읽고 보낸다, 치료 결과를 약속하는 표현은 쓰지 않는다. 그리고 직무별로 바로 써 볼 것 하나씩 넣어 줘. 리셉션은 외국인 환자 통역, 원무과는 보험 서류 안내를 쉬운 말로 바꾸기, 치과위생사는 발치 후 주의사항 카드 만들기."},
  {t:"오늘 만든 것 정리",p:"오늘 이 대화에서 만든 문서들을 목록으로 정리하고, 이번 달 안에 실제로 쓸 순서를 추천해 줘. 각 문서에서 사람이 꼭 확인해야 할 부분도 한 줄씩 적어 줘.",h:"결과는 카카오톡 나에게 보내기나 메모 앱에 저장해 두세요."}
 ]
};
const ORDER=["basic","hire","onb","rel","keep"];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main=document.getElementById("main"),tabs=document.getElementById("tabs"),toast=document.getElementById("toast");
let num=0;const REG={};
ORDER.forEach(k=>P[k].forEach(it=>{if(it.p){it.n=++num;REG[it.n]=it}}));

function cardPrompt(it){
  return '<div class="card"><h3><span class="n">'+it.n+'</span>'+esc(it.t)+'</h3>'+
   '<pre class="prompt" id="p'+it.n+'">'+esc(it.p.trim())+'</pre>'+
   (it.h?'<p class="hint">'+esc(it.h)+'</p>':'')+
   '<button class="copy" data-n="'+it.n+'">요청문 복사</button></div>';
}
function cardLab(){
  return '<div class="card"><h3><span class="n">●</span>AI는 우리 회사를 알까</h3>'+
   '<label class="in" for="org">회사 이름을 입력하세요 (저장되지 않습니다)</label>'+
   '<input class="txt" id="org" type="text" autocomplete="off" placeholder="예: 우리 치과 이름">'+
   '<pre class="prompt" id="labp" style="margin-top:10px"></pre>'+
   '<p class="hint">나온 답이 실제와 맞는지 확인해 보세요. 그럴듯하게 틀릴 수 있습니다.</p>'+
   '<button class="copy" data-lab="1">요청문 복사</button></div>';
}
function labText(){const v=(document.getElementById("org")||{}).value||"";const name=v.trim()||"○○ 치과";
  return name+" 진료 시간 알려줘. 야간진료는 무슨 요일이야?";}
function cardPCI(){
  return '<div class="card"><h3><span class="n">●</span>요청문의 기본 틀</h3>'+
   '<div class="pci">'+
   '<div><b>페르소나</b><span>누구로서 무슨 일을 할지. 너는 치과 채용을 오래 도와 온 인사 담당자야. 채용 공고를 써 줘.</span></div>'+
   '<div><b>맥락</b><span>누가 읽고 어떤 상황인지. 지방 치과라 지원자가 적어. 읽는 사람은 이직을 고민하는 3년차 치과위생사야.</span></div>'+
   '<div><b>지시</b><span>형식과 하지 말 것. 근무 조건은 지어내지 말고, 모르는 건 확인 필요라고 표시해 줘.</span></div>'+
   '</div><p class="hint">이 세 가지가 들어가면 결과가 달라집니다. 아래 채용 탭의 요청문도 이 틀로 되어 있습니다.</p></div>';
}
function cardHITL(){
  return '<div class="card"><h3><span class="n">●</span>AI가 쓰고, 사람이 정한다</h3><div class="steps">'+
   '<div class="step"><span class="k">1</span><p>AI가 초안을 만든다<small>공고, 안내문, 면담 질문지</small></p></div>'+
   '<div class="step human"><span class="k">2</span><p>사람이 확인한다<small>사실과 숫자, 개인정보, 노무 관련 표현</small></p></div>'+
   '<div class="step human"><span class="k">3</span><p>사람이 결정하고 내보낸다<small>게시, 발송, 시행은 책임자가 승인한 뒤에</small></p></div>'+
   '</div><p class="hint">AI 활용에서 리더가 맡는 자리는 2번과 3번입니다.</p></div>';
}
function render(k){
  const s=T[k];
  [...tabs.children].forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k?"true":"false"));
  let h='<h2 class="sec">'+esc(s.title)+'</h2><p class="sec-desc">'+esc(s.desc)+'</p>';
  P[k].forEach(it=>{h+= it.type==="lab"?cardLab(): it.type==="pci"?cardPCI(): it.type==="hitl"?cardHITL(): cardPrompt(it)});
  main.innerHTML=h;
  const org=document.getElementById("org");
  if(org){const upd=()=>{document.getElementById("labp").textContent=labText()};org.addEventListener("input",upd);upd();}
  window.scrollTo({top:0});
}
ORDER.forEach(k=>{const b=document.createElement("button");b.type="button";b.dataset.k=k;b.setAttribute("role","tab");
  b.innerHTML='<span class="dot"></span>'+esc(T[k].tab);b.onclick=()=>render(k);tabs.appendChild(b)});

function showToast(t){toast.textContent=t;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),1500)}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
  ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;
  try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
main.addEventListener("click",async e=>{
  const btn=e.target.closest(".copy");if(!btn)return;
  let text,preId;
  if(btn.dataset.lab){text=labText();preId="labp"}
  else{const it=REG[btn.dataset.n];text=it.p;preId="p"+it.n;
    if(it.chk&&!window.confirm("붙여 넣을 내용에 직원·지원자 이름, 연락처, 이력서 원본이 없는지 확인하셨나요?"))return;}
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(err){}
  if(!ok)ok=fallbackCopy(text);
  if(ok){btn.textContent="복사했습니다";btn.classList.add("done");showToast("AI 앱에 붙여 넣으세요");
    setTimeout(()=>{btn.textContent="요청문 복사";btn.classList.remove("done")},1600)}
  else{const pre=document.getElementById(preId);const r=document.createRange();r.selectNodeContents(pre);
    const sel=getSelection();sel.removeAllRanges();sel.addRange(r);showToast("글자를 길게 눌러 복사하세요")}
});
render("basic");
</script>
</body>
</html>
